<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Main container -->
  <rect width="900" height="240" rx="16" fill="url(#bg)" />
  <rect width="900" height="240" rx="16" fill="url(#grid)" />

  <!-- Subtle glowing orbs -->
  <circle cx="800" cy="45" r="130" fill="#38BDF8" opacity="0.12" />
  <circle cx="710" cy="210" r="140" fill="#818CF8" opacity="0.10" />
  <circle cx="90" cy="210" r="95" fill="#10B981" opacity="0.08" />

  <!-- Top accent bar -->
  <rect x="48" y="34" width="68" height="4" rx="2" fill="url(#accent)" />

  <!-- Location & Academic Pill -->
  <g transform="translate(48, 52)">
    <rect width="465" height="28" rx="14" fill="url(#badgeBg)" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10B981" />
    <text x="30" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">
      Cali, Colombia  ·  Raíces en Magüí Payán  ·  Ing. de Sistemas @ Icesi
    </text>
  </g>

  <!-- Name and Brand -->
  <text x="48" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
    Juan Miguel Guerrero
  </text>
  <text x="458" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#accent)" letter-spacing="-0.5">
    · MagnusCode
  </text>

  <!-- Subtitle -->
  <text x="48" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#94A3B8">
    Webs, menús digitales, bots de WhatsApp y software a la medida para negocios locales.
  </text>

  <!-- Bottom tags -->
  <g transform="translate(48, 186)">
    <rect x="0" y="0" width="218" height="26" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.45" />
    <text x="12" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#38BDF8">
      ⚡ Full AI · Yo me encargo de dirigir
    </text>

    <rect x="230" y="0" width="200" height="26" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1" stroke-opacity="0.45" />
    <text x="242" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#A5B4FC">
      🚧 Construyendo: Mi Wapi
    </text>

    <rect x="442" y="0" width="215" height="26" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" stroke-opacity="0.45" />
    <text x="454" y="17" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#34D399">
      🎯 Impacto real en negocios
    </text>
  </g>

  <!-- Right decorative terminal card -->
  <g transform="translate(730, 52)">
    <rect width="128" height="110" rx="12" fill="#090D16" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#EF4444" />
    <circle cx="28" cy="16" r="4" fill="#F59E0B" />
    <circle cx="40" cy="16" r="4" fill="#10B981" />
    <text x="16" y="48" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#38BDF8">&gt; magnus</text>
    <text x="16" y="68" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94A3B8">ai: "dirigida"</text>
    <text x="16" y="86" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#34D399">status: "ship"</text>
  </g>
</svg>

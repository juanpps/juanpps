<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="55%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#17153B" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <!-- Main canvas -->
  <rect width="920" height="265" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="920" height="265" rx="18" fill="url(#grid)" />

  <!-- Subtle glowing backdrop lights -->
  <circle cx="820" cy="40" r="150" fill="#38BDF8" opacity="0.11" />
  <circle cx="700" cy="230" r="145" fill="#818CF8" opacity="0.10" />
  <circle cx="110" cy="230" r="110" fill="#10B981" opacity="0.08" />

  <!-- Top glowing accent line -->
  <rect x="44" y="28" width="84" height="4" rx="2" fill="url(#brandGrad)" />

  <!-- Top Pills: Academic Distinction + Location -->
  <g transform="translate(44, 44)">
    <!-- Academic Pill -->
    <rect x="0" y="0" width="338" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="14" r="4.5" fill="#38BDF8" />
    <text x="28" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">
      🎓 Ing. de Sistemas @ Universidad Icesi (Beca 100%)
    </text>

    <!-- Location Pill -->
    <rect x="348" y="0" width="236" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <circle cx="364" cy="14" r="4.5" fill="#10B981" />
    <text x="376" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">
      Cali, CO · Raíces en Magüí Payán
    </text>
  </g>

  <!-- Name and Brand -->
  <text x="44" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.6">
    Juan Miguel Guerrero
  </text>
  <text x="448" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#brandGrad)" letter-spacing="-0.6">
    · MagnusCode
  </text>

  <!-- Subtitle / Core Value Proposition -->
  <text x="44" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#E2E8F0">
    AI-First Software Builder · Soluciones Digitales para Negocios · Explorando Ciberseguridad
  </text>
  <text x="44" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8">
    Webs, menús digitales, bots de WhatsApp y herramientas a la medida con arquitectura dirigida por IA.
  </text>

  <!-- Bottom Feature Badges -->
  <g transform="translate(44, 204)">
    <rect x="0" y="0" width="234" height="28" rx="7" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
    <text x="12" y="18" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#38BDF8">
      🧠 AI-Orchestrated Engineering
    </text>

    <rect x="244" y="0" width="204" height="28" rx="7" fill="#0F172A" stroke="#10B981" stroke-width="1" stroke-opacity="0.5" />
    <text x="256" y="18" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#34D399">
      🐧 Linux · Termux · Security
    </text>

    <rect x="458" y="0" width="188" height="28" rx="7" fill="#0F172A" stroke="#818CF8" stroke-width="1" stroke-opacity="0.5" />
    <text x="470" y="18" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#A5B4FC">
      🚀 Construyendo: Mi Wapi
    </text>
  </g>

  <!-- Right Decorative Terminal Window -->
  <g transform="translate(662, 36)">
    <rect width="222" height="196" rx="12" fill="#050811" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
    <!-- Terminal Header -->
    <rect width="222" height="28" rx="12" fill="#0F172A" />
    <circle cx="16" cy="14" r="4.5" fill="#EF4444" />
    <circle cx="30" cy="14" r="4.5" fill="#F59E0B" />
    <circle cx="44" cy="14" r="4.5" fill="#10B981" />
    <text x="64" y="18" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#64748B">juan@debian-termux:~</text>

    <!-- Terminal Body -->
    <text x="16" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#34D399">$ whoami</text>
    <text x="16" y="70" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#E2E8F0">magnus · systems-eng @ icesi</text>

    <text x="16" y="96" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8">$ cat stack.yml</text>
    <text x="16" y="114" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#94A3B8">core: [TS, Python, Java]</text>
    <text x="16" y="130" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#94A3B8">env:  [Linux, Termux, Cloud]</text>
    <text x="16" y="146" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#C084FC">sec:  [Cybersecurity Lab]</text>

    <text x="16" y="172" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#34D399">$ ai-agent --deploy</text>
    <text x="16" y="186" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#38BDF8">✓ Architecture validated</text>
  </g>
</svg>

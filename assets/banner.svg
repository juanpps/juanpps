<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="55%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#17153B" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <!-- Main canvas -->
  <rect width="920" height="265" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="920" height="265" rx="18" fill="url(#grid)" />

  <!-- Subtle glowing backdrop lights -->
  <circle cx="820" cy="40" r="150" fill="#38BDF8" opacity="0.11" />
  <circle cx="700" cy="230" r="145" fill="#818CF8" opacity="0.10" />
  <circle cx="110" cy="230" r="110" fill="#10B981" opacity="0.08" />

  <!-- Top glowing accent line -->
  <rect x="38" y="26" width="76" height="4" rx="2" fill="url(#brandGrad)" />

  <!-- Top Pills: Academic Distinction + Location (fits strictly within x=38..636) -->
  <g transform="translate(38, 42)">
    <!-- Academic Pill -->
    <rect x="0" y="0" width="340" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="16" cy="14" r="4.5" fill="#38BDF8" />
    <text x="28" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.3" font-weight="700" fill="#F8FAFC">
      Ing. de Sistemas @ Universidad Icesi · Beca 100%
    </text>

    <!-- Location Pill -->
    <rect x="350" y="0" width="244" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <circle cx="366" cy="14" r="4.5" fill="#10B981" />
    <text x="378" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.3" font-weight="600" fill="#CBD5E1">
      Cali, CO · Raíces en Magüí Payán
    </text>
  </g>

  <!-- Name and Brand -->
  <text x="38" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30.5" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Juan Miguel Guerrero</tspan>
    <tspan fill="#64748B"> · </tspan>
    <tspan fill="url(#brandGrad)">MagnusCode</tspan>
  </text>

  <!-- Subtitle / Core Value Proposition -->
  <text x="38" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.8" font-weight="600" fill="#E2E8F0">
    Desarrollador de Software · Soluciones para Negocios · Explorando Ciberseguridad
  </text>
  <text x="38" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.6" font-weight="400" fill="#94A3B8">
    Webs, menús digitales, bots de WhatsApp y sistemas a la medida potenciados con IA.
  </text>

  <!-- Bottom Feature Badges (Centered text inside each pill, total width 592px -> ends at x=630) -->
  <g transform="translate(38, 200)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="196" height="28" rx="7" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.55" />
    <text x="98" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11" font-weight="600" fill="#38BDF8">
      ● Desarrollo asistido IA
    </text>

    <!-- Badge 2 -->
    <rect x="206" y="0" width="190" height="28" rx="7" fill="#0F172A" stroke="#10B981" stroke-width="1" stroke-opacity="0.55" />
    <text x="301" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11" font-weight="600" fill="#34D399">
      ● Linux · Termux · Cyber
    </text>

    <!-- Badge 3 -->
    <rect x="406" y="0" width="186" height="28" rx="7" fill="#0F172A" stroke="#818CF8" stroke-width="1" stroke-opacity="0.55" />
    <text x="499" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11" font-weight="600" fill="#A5B4FC">
      ● Construyendo Mi Wapi
    </text>
  </g>

  <!-- Right Decorative Terminal Window (Starts at x=658) -->
  <g transform="translate(658, 34)">
    <rect width="224" height="198" rx="12" fill="#050811" fill-opacity="0.95" stroke="#334155" stroke-width="1.2" />
    <!-- Terminal Header -->
    <rect width="224" height="28" rx="12" fill="#0F172A" />
    <circle cx="16" cy="14" r="4.5" fill="#EF4444" />
    <circle cx="30" cy="14" r="4.5" fill="#F59E0B" />
    <circle cx="44" cy="14" r="4.5" fill="#10B981" />
    <text x="62" y="18" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#64748B">juan@debian-termux:~</text>

    <!-- Terminal Body -->
    <text x="16" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#34D399">$ whoami</text>
    <text x="16" y="70" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#E2E8F0">magnus · ing-sistemas @ icesi</text>

    <text x="16" y="96" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8">$ cat stack.yml</text>
    <text x="16" y="114" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#94A3B8">lang: [TS, Python, Java]</text>
    <text x="16" y="130" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#94A3B8">env:  [Linux, Termux, Cloud]</text>
    <text x="16" y="146" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#C084FC">sec:  [Cybersecurity Lab]</text>

    <text x="16" y="172" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#34D399">$ magnus deploy --prod</text>
    <text x="16" y="188" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#38BDF8">✓ Build &amp; checks passed</text>
  </g>
</svg>
